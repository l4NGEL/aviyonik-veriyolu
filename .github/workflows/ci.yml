name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    name: Derleme + test (Ubuntu 24.04, GCC 14, FreeRTOS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 g++-14 ninja-build libgtest-dev can-utils
      - name: Çekirdek sürümü
        id: cekirdek
        run: echo "surum=$(uname -r)" >> "$GITHUB_OUTPUT"
      - name: CAN çekirdek modülleri önbelleği
        uses: actions/cache@v4
        with:
          path: ~/can-mod
          key: can-mod-${{ steps.cekirdek.outputs.surum }}
      - name: SocketCAN sanal arayüzü (varsa)
        # vcan, Azure çekirdeğinde linux-modules-extra paketinde (51 MB) ve runner'ın Azure aynası
        # bazen ~100 kB/s'ye düşüyor. Paket archive.ubuntu.com'dan çekiliyor, yalnız CAN modülleri
        # çekirdek sürümüne göre önbellekte tutuluyor.
        run: |
          set +e
          K=$(uname -r)
          if ! sudo modprobe vcan 2>/dev/null; then
            if [ ! -d ~/can-mod/net/can ]; then
              cd /tmp
              URL=$(apt-get download --print-uris linux-modules-extra-$K | head -1 | cut -d"'" -f2)
              ALT=$(echo "$URL" | sed 's#//azure\.archive\.ubuntu\.com/#//archive.ubuntu.com/#')
              echo "indiriliyor: $ALT"
              curl -fsSL --max-time 600 -o mx.deb "$ALT" || curl -fsSL --max-time 600 -o mx.deb "$URL"
              dpkg-deb -x mx.deb mx
              for d in net/can drivers/net/can; do
                [ -d mx/lib/modules/$K/kernel/$d ] && mkdir -p ~/can-mod/$d && cp -r mx/lib/modules/$K/kernel/$d/. ~/can-mod/$d/
              done
            fi
            for d in net/can drivers/net/can; do
              [ -d ~/can-mod/$d ] && sudo mkdir -p /lib/modules/$K/kernel/$d && sudo cp -r ~/can-mod/$d/. /lib/modules/$K/kernel/$d/
            done
            sudo depmod -a
          fi
          if sudo modprobe vcan && sudo modprobe can-raw && sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0; then
            ip -br link show vcan0
          else
            echo "::warning::vcan kullanılamıyor; SocketCAN testleri atlanacak"
          fi
      - name: Yapılandır
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAVB_WERROR=ON
          -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
      - name: Derle
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libgtest-dev
      - name: Yapılandır
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAVB_WERROR=ON -DAVB_BUILD_RTOS=OFF
          -DAVB_SANITIZE=address,undefined
      - name: Derle
        run: cmake --build build
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  analiz:
    name: Kapsama (MC/DC) + cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 g++-14 ninja-build libgtest-dev cppcheck
      - name: cppcheck
        run: cppcheck --enable=warning,performance,portability --std=c++17 --error-exitcode=1 -q -I include src apps
      - name: Kapsamalı derleme ve test
        run: |
          cmake -S . -B build -G Ninja -DAVB_COVERAGE=ON -DAVB_BUILD_RTOS=OFF \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Kapsama özeti
        run: |
          cd build
          gcov-14 -b --conditions $(find . -name "*.gcda" -path "*avb.dir*") | grep -A3 "^File '.*/src/" || true
